name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Hard gates: these fail the build (nothing that works today may break) ---
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test

      # --- Warn-mode gates: report but don't block yet. Remove continue-on-error
      #     per category once its backlog is clear (TOOLING_STANDARD.md → ratchet). ---
      - name: Type-check
        run: pnpm run typecheck
        continue-on-error: true
      - name: Lint
        run: pnpm run lint
        continue-on-error: true
      - name: Coverage
        run: pnpm run coverage
        continue-on-error: true
      - name: Dead-code (knip)
        run: pnpm run knip
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip if no e2e specs
        id: haveE2e
        run: |
          if ls e2e/*.spec.ts >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright browsers
        if: steps.haveE2e.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        if: steps.haveE2e.outputs.run == 'true'
        run: pnpm run test:e2e
        continue-on-error: true
