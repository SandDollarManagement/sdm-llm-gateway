# Generated by the SDM tooling standard (standard-tooling/node). Warn-mode by design:
# type-check / lint / coverage / dead-code REPORT but do not block (continue-on-error).
# Flip a step to blocking by removing its `continue-on-error: true` once its backlog clears.
name: Tooling Standard
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: tooling-standard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Coverage
        run: npm run coverage
        continue-on-error: true
      - name: Dead-code (knip)
        run: npm run knip
        continue-on-error: true
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npm exec -- playwright install --with-deps chromium
        continue-on-error: true
      - name: E2E + accessibility
        run: npm run test:e2e
        continue-on-error: true
